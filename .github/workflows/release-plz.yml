name: Release-plz

on:
    push:
        branches: [main]

jobs:
    release-plz-release:
        name: Release-plz release
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  # release-plz parses the full commit history to determine the bump.
                  fetch-depth: 0
            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
              with:
                toolchain: stable
            - name: Install unixODBC
              run: |
                  sudo apt-get update
                  sudo apt-get install -y unixodbc-dev
            - name: Run release-plz
              uses: MarcoIeni/release-plz-action@7ef5e4d4b0420630cfcaeb182c01e13651d4c577 # v0.5
              with:
                  command: release
              env:
                  GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
                  CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}

    # Create a PR with the new versions and changelog, preparing the next release.
    release-plz-pr:
        name: Release-plz PR
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        concurrency:
            group: release-plz-${{ github.ref }}
            cancel-in-progress: false
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
              with:
                toolchain: stable
            - name: Run release-plz
              uses: MarcoIeni/release-plz-action@7ef5e4d4b0420630cfcaeb182c01e13651d4c577 # v0.5
              with:
                  command: release-pr
              env:
                  GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
                  CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
